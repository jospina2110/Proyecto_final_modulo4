services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_network

  backend:
    build: ./backend
    image: ${DOCKERHUB_USERNAME:-local}/medical-appointments-backend:v1.0
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: ${MONGO_DB:-medical_appointments}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - app_network

  frontend:
    build: ./frontend
    image: ${DOCKERHUB_USERNAME:-local}/medical-appointments-frontend:v1.0
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:8080:80"
    depends_on:
      - backend
    networks:
      - app_network

volumes:
  mongo_data:

networks:
  app_network:
    driver: bridge
